name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.5.beta
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you install the app from?
      options:
        - GitHub Releases
        - F-Droid
        - IzzyOnDroid
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any tokens or private information first
